<title>Empire Doctor Command • DR01</title>
<style>
:root{--bg:#030604;--panel:#09110d;--panel2:#0d1812;--gold:#d9b45b;--gold2:#f2da91;--green:#1bb678;--text:#f7f1df;--muted:#a8b1aa;--line:rgba(217,180,91,.27)}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -5%,rgba(11,103,69,.22),transparent 29%),linear-gradient(180deg,#06100b,#020403 58%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.shell{max-width:540px;margin:auto;padding:20px 18px 32px}.brand{text-align:center;padding:3px 0 19px}.logo{width:112px;height:112px;border-radius:50%;object-fit:cover;object-position:center 16%;border:1px solid rgba(217,180,91,.48);box-shadow:0 0 30px rgba(217,180,91,.11);margin-bottom:10px}.eyebrow{font-size:10px;letter-spacing:.21em;color:var(--gold);text-transform:uppercase}.brand h1{font-family:Georgia,serif;font-size:25px;letter-spacing:.045em;font-weight:500;margin:6px 0 4px}.tagline{font-size:11px;color:#b7c4bc}
.welcome{border:1px solid var(--line);border-radius:18px;padding:16px 17px;background:linear-gradient(145deg,rgba(13,24,18,.96),rgba(5,10,7,.96));margin-bottom:12px}.welcome small{display:block;color:var(--gold);font-size:9.5px;letter-spacing:.17em;margin-bottom:6px}.welcome strong{font:500 19px Georgia,serif}.status{font-size:11px;color:#b3bcb6;margin-top:8px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3bd08b;box-shadow:0 0 9px #3bd08b;margin-right:7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{appearance:none;border:1px solid var(--line);border-radius:17px;min-height:105px;padding:15px;text-align:left;background:linear-gradient(145deg,var(--panel2),var(--panel));color:var(--text);cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.2)}.card:active{transform:scale(.985);border-color:var(--gold)}.icon{color:var(--gold2);font-size:21px;margin-bottom:11px}.card b{display:block;font:500 15px Georgia,serif;margin-bottom:5px}.card span{display:block;font-size:10.2px;line-height:1.35;color:var(--muted)}.wide{grid-column:1/-1;min-height:78px;display:flex;align-items:center;gap:14px}.wide .icon{margin:0}
footer{text-align:center;color:#69746d;font-size:9px;letter-spacing:.11em;padding-top:22px}footer strong{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,18px);opacity:0;background:#142019;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:11px;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.shell{padding-left:12px;padding-right:12px}.card{padding:13px}.logo{width:96px;height:96px}}
</style>

const routes={"Patient Check-In":"https://dwibhashikarteek-sketch.github.io/dr-karteek-digital-card/empire-smart-check-in.html","Next Patient":"https://dwibhashikarteek-sketch.github.io/dr-karteek-digital-card/empire-token-desk.html","AI Scans":"https://dwibhashikarteek-sketch.github.io/dr-karteek-digital-card/empire-ai-scan-control-doctor-v1.html"};const toast=document.getElementById('toast');
